# Serves the Angular page and forwards /api to the API container (docker-compose.yml).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never refuse an upload here: the API has its own size limit (Documents:MaxSizeBytes) and its own message.
    client_max_body_size 0;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's own name server, asked again every 10 seconds: the API container can be recreated
    # (a rebuild) without nginx keeping an old address. The variable makes nginx resolve the name at each request.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A local model without a GPU can take minutes: wait longer than the API's own time limit
        # for the model (Ollama:TimeoutSeconds, 120 seconds by default), so the API's message is what the person sees.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;

        # Uploads go through as they arrive instead of being kept in memory first.
        proxy_request_buffering off;
    }

    # The page: any other address is a route of the app, so it gets index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
